[theme]
# Theme configuration for light/dark mode auto-detection
base = "light"  # Can be "light" or "dark", but auto-detects OS preference
primaryColor = "#10b981"  # Emerald green for primary elements
backgroundColor = "#ffffff"  # Background color
secondaryBackgroundColor = "#f0f2f6"  # Sidebar and containers

[server]
# Server configuration suitable for local development and Streamlit Cloud
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200  # MB
enableWebsocketCompression = false

[browser]
# Browser settings
gatherUsageStats = false